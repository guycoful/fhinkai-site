name: Validate fhinkai-site

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate static site files
        run: |
          set -euo pipefail

          test -f index.html
          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -name '.DS_Store' \
            ! -name 'Thumbs.db' \
            | sed 's#^\./##' \
            | sort > deploy-files.txt

          test -s deploy-files.txt

          echo "Files ready for JetServer cron deployment:"
          cat deploy-files.txt

      - name: Deployment note
        run: |
          cat <<'EOF'
          JetServer blocks GitHub-hosted runners from connecting to cPanel port 2083.
          Production deployment is pulled from JetServer by cPanel Cron using cpanel-deploy.php.
          EOF
