name: Keep Edge Functions Warm

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping create-lead (rejected fast, keeps it warm)
        run: |
          curl -s -o /dev/null -w "create-lead: %{http_code} %{time_total}s\n" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            https://vuvavjmbvdqnwtleudqh.supabase.co/functions/v1/create-lead || true

      - name: Ping save-pretest-answers (rejected fast, keeps it warm)
        run: |
          curl -s -o /dev/null -w "save-pretest-answers: %{http_code} %{time_total}s\n" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            https://vuvavjmbvdqnwtleudqh.supabase.co/functions/v1/save-pretest-answers || true
