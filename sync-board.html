<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>לוח סנכרון - פיילוט עומרי</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: #f4f7f6;
      --surface: #ffffff;
      --surface-2: #f8faf9;
      --text: #18201c;
      --muted: #60706a;
      --line: #dce5e1;
      --teal: #1f7a6d;
      --teal-soft: #e6f4f1;
      --amber: #9f6b16;
      --amber-soft: #fff4dc;
      --blue: #255b8d;
      --blue-soft: #e8f1fb;
      --green: #28734f;
      --green-soft: #e7f5ed;
      --red: #a9413a;
      --red-soft: #fae9e7;
      --shadow: 0 10px 24px rgba(24, 32, 28, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Heebo", sans-serif;
      background: var(--page);
      color: var(--text);
    }

    button, input, textarea { font: inherit; }

    .app {
      max-width: 1480px;
      margin: 0 auto;
      padding: 18px;
    }

    .top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: stretch;
      margin-bottom: 14px;
    }

    .headline {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      line-height: 1.2;
    }

    .headline p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      max-width: 880px;
    }

    .meta {
      min-width: 280px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 8px;
      align-content: center;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .meta-row strong { color: var(--text); }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      min-height: 40px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--amber);
      flex: 0 0 auto;
    }

    .dot.ok { background: var(--green); }
    .dot.bad { background: var(--red); }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .field {
      min-height: 40px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 9px 10px;
      outline: none;
    }

    .field:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(31, 122, 109, 0.14);
    }

    .updated-by { width: 160px; }

    .btn {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .btn:hover { border-color: #b8c7c1; }
    .btn:disabled { opacity: 0.55; cursor: wait; }
    .btn.primary { background: var(--teal); color: #fff; border-color: var(--teal); }
    .btn.danger { background: var(--red-soft); color: var(--red); border-color: #efc7c2; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
      align-items: start;
    }

    .column {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 420px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .column-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-2);
      border-radius: 8px 8px 0 0;
    }

    .column h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .count {
      min-width: 32px;
      height: 28px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      font-size: 13px;
      font-weight: 800;
    }

    .count.amber { background: var(--amber-soft); color: var(--amber); }
    .count.blue { background: var(--blue-soft); color: var(--blue); }
    .count.green { background: var(--green-soft); color: var(--green); }

    .items {
      display: grid;
      gap: 10px;
      padding: 12px;
      flex: 1;
      align-content: start;
    }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .card-tools {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .card-tools strong {
      font-size: 13px;
      color: var(--muted);
    }

    .icon-row {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      font-weight: 800;
      line-height: 1;
    }

    .icon-btn:hover { border-color: var(--teal); color: var(--teal); }

    .card-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 138px;
      gap: 8px;
    }

    textarea.field {
      min-height: 74px;
      resize: vertical;
      line-height: 1.45;
    }

    .add-card {
      margin: 0 12px 12px;
      justify-content: center;
      border-style: dashed;
      color: var(--muted);
    }

    .notes {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .note {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .note h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .note textarea { min-height: 150px; }

    .share {
      width: min(720px, calc(100vw - 24px));
      position: fixed;
      right: 50%;
      bottom: 18px;
      transform: translateX(50%) translateY(140%);
      background: #17231f;
      color: #fff;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.22);
      display: grid;
      gap: 8px;
      transition: transform 0.2s ease;
      z-index: 20;
    }

    .share.open { transform: translateX(50%) translateY(0); }

    .share-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    .share input {
      direction: ltr;
      text-align: left;
    }

    .toast {
      position: fixed;
      left: 18px;
      bottom: 18px;
      background: #17231f;
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      z-index: 30;
    }

    .toast.open {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 980px) {
      .top, .board, .notes { grid-template-columns: 1fr; }
      .meta { min-width: 0; }
    }

    @media (max-width: 620px) {
      .app { padding: 10px; }
      .toolbar { align-items: stretch; }
      .actions { width: 100%; }
      .btn, .updated-by { flex: 1 1 auto; }
      .card-grid { grid-template-columns: 1fr; }
      .share-row { grid-template-columns: 1fr; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="top">
      <div class="headline">
        <h1 id="boardTitle">לוח סנכרון - פיילוט עומרי</h1>
        <p id="boardDescription">טוען לוח עבודה משותף...</p>
      </div>
      <aside class="meta">
        <div class="meta-row"><strong>עדכון אחרון</strong><span id="lastUpdated">-</span></div>
        <div class="meta-row"><strong>עודכן על ידי</strong><span id="lastUpdatedBy">-</span></div>
      </aside>
    </section>

    <section class="toolbar">
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">מכין לוח...</span></div>
      <div class="actions">
        <input class="field updated-by" id="updatedByInput" placeholder="מי מעדכן עכשיו">
        <button class="btn" id="reloadBtn" type="button">↻ רענון</button>
        <button class="btn" id="shareBtn" type="button">⛓ קישור שיתוף</button>
        <button class="btn danger" id="resetBtn" type="button">איפוס מקומי</button>
        <button class="btn primary" id="saveBtn" type="button">✓ שמירה</button>
      </div>
    </section>

    <section class="board" id="boardColumns"></section>

    <section class="notes">
      <article class="note">
        <h3>הערה כללית</h3>
        <textarea class="field" id="noteGeneral"></textarea>
      </article>
      <article class="note">
        <h3>הערות מעומרי</h3>
        <textarea class="field" id="noteOmri"></textarea>
      </article>
      <article class="note">
        <h3>הערות מגיא</h3>
        <textarea class="field" id="noteGuy"></textarea>
      </article>
    </section>
  </main>

  <section class="share" id="sharePanel" aria-live="polite">
    <strong>קישור לשיתוף עם עומרי והצוות</strong>
    <div class="share-row">
      <input class="field" id="shareLink" readonly>
      <button class="btn primary" id="copyShareBtn" type="button">העתקה</button>
    </div>
  </section>
  <div class="toast" id="toast"></div>

  <script>
    const BOARD_SLUG = 'omri-pilot';
    const API_URL = 'sync-board-api.php';
    const KEY_STORAGE = 'fhinkai_sync_board_key';
    const UPDATED_BY_STORAGE = 'fhinkai_sync_board_updated_by';

    const boardTitle = document.getElementById('boardTitle');
    const boardDescription = document.getElementById('boardDescription');
    const lastUpdated = document.getElementById('lastUpdated');
    const lastUpdatedBy = document.getElementById('lastUpdatedBy');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const boardColumns = document.getElementById('boardColumns');
    const updatedByInput = document.getElementById('updatedByInput');
    const reloadBtn = document.getElementById('reloadBtn');
    const shareBtn = document.getElementById('shareBtn');
    const resetBtn = document.getElementById('resetBtn');
    const saveBtn = document.getElementById('saveBtn');
    const noteGeneral = document.getElementById('noteGeneral');
    const noteOmri = document.getElementById('noteOmri');
    const noteGuy = document.getElementById('noteGuy');
    const sharePanel = document.getElementById('sharePanel');
    const shareLink = document.getElementById('shareLink');
    const copyShareBtn = document.getElementById('copyShareBtn');
    const toast = document.getElementById('toast');

    let boardRow = null;
    let boardState = null;
    let boardKey = '';

    const defaultBoard = {
      title: 'לוח סנכרון - פיילוט עומרי',
      description: 'לוח עבודה משותף לצוות הפיילוט. מעדכנים רק את מה שצריך כדי שהחלטות, חסימות ואחריות לא ייפלו בין הכיסאות.',
      columns: [
        { id: 'todo', title: 'לבדיקה', color: 'amber', items: [] },
        { id: 'doing', title: 'בתהליך', color: 'blue', items: [] },
        { id: 'done', title: 'סגור', color: 'green', items: [] }
      ],
      notes: { general: '', omri: '', guy: '' }
    };

    function setStatus(text, mode = 'wait') {
      statusText.textContent = text;
      statusDot.className = `dot ${mode === 'ok' ? 'ok' : mode === 'bad' ? 'bad' : ''}`;
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('open');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('open'), 2200);
    }

    function uid() {
      return `id-${crypto.getRandomValues(new Uint32Array(2)).join('-')}`;
    }

    function randomKey() {
      const bytes = new Uint8Array(24);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('');
    }

    function getInitialKey() {
      const params = new URLSearchParams(location.search);
      const keyFromUrl = params.get('key') || '';
      if (keyFromUrl.length >= 24) {
        sessionStorage.setItem(KEY_STORAGE, keyFromUrl);
        return keyFromUrl;
      }

      const stored = sessionStorage.getItem(KEY_STORAGE) || localStorage.getItem(KEY_STORAGE) || '';
      if (stored.length >= 24) return stored;

      const created = randomKey();
      localStorage.setItem(KEY_STORAGE, created);
      const nextUrl = new URL(location.href);
      nextUrl.searchParams.set('board', BOARD_SLUG);
      nextUrl.searchParams.set('key', created);
      history.replaceState(null, '', nextUrl.toString());
      return created;
    }

    function currentShareUrl() {
      const url = new URL(location.href);
      url.searchParams.set('board', BOARD_SLUG);
      url.searchParams.set('key', boardKey);
      return url.toString();
    }

    function safeBoard(payload) {
      const next = structuredClone(defaultBoard);
      if (!payload || typeof payload !== 'object') return next;
      if (typeof payload.title === 'string') next.title = payload.title;
      if (typeof payload.description === 'string') next.description = payload.description;
      if (payload.notes && typeof payload.notes === 'object') {
        next.notes.general = String(payload.notes.general || '');
        next.notes.omri = String(payload.notes.omri || '');
        next.notes.guy = String(payload.notes.guy || '');
      }
      if (Array.isArray(payload.columns)) {
        next.columns = payload.columns.map((column, index) => ({
          id: String(column.id || `col-${index + 1}`),
          title: String(column.title || `עמודה ${index + 1}`),
          color: ['amber', 'blue', 'green'].includes(column.color) ? column.color : 'blue',
          items: Array.isArray(column.items) ? column.items.map((item) => ({
            id: String(item.id || uid()),
            title: String(item.title || ''),
            owner: String(item.owner || ''),
            due: String(item.due || ''),
            notes: String(item.notes || ''),
            updatedAt: String(item.updatedAt || '')
          })) : []
        }));
      }
      return next;
    }

    async function loadBoard() {
      setStatus('טוען לוח...');
      const response = await fetch(`${API_URL}?slug=${encodeURIComponent(BOARD_SLUG)}&key=${encodeURIComponent(boardKey)}`, {
        cache: 'no-store'
      });

      if (response.status === 401) {
        setStatus('אין הרשאה לקישור הזה.', 'bad');
        throw new Error('unauthorized');
      }

      if (!response.ok) {
        setStatus('טעינת הלוח נכשלה.', 'bad');
        throw new Error(await response.text());
      }

      boardRow = await response.json();
      boardState = safeBoard(boardRow.payload);
      renderBoard();
      setStatus('הלוח מסונכרן.', 'ok');
    }

    async function saveBoard() {
      if (!boardState) return;
      collectNotes();
      saveBtn.disabled = true;
      setStatus('שומר שינויים...');

      const updatedBy = updatedByInput.value.trim();
      if (updatedBy) localStorage.setItem(UPDATED_BY_STORAGE, updatedBy);

      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          slug: BOARD_SLUG,
          key: boardKey,
          updatedBy,
          payload: boardState
        })
      });

      saveBtn.disabled = false;

      if (!response.ok) {
        setStatus('שמירה נכשלה.', 'bad');
        throw new Error(await response.text());
      }

      boardRow = await response.json();
      boardState = safeBoard(boardRow.payload);
      renderBoard();
      setStatus('השינויים נשמרו.', 'ok');
      showToast('נשמר');
    }

    function renderBoard() {
      boardTitle.textContent = boardState.title;
      boardDescription.textContent = boardState.description;
      lastUpdated.textContent = boardRow?.updated_at ? new Date(boardRow.updated_at).toLocaleString('he-IL') : '-';
      lastUpdatedBy.textContent = boardRow?.updated_by || '-';
      noteGeneral.value = boardState.notes.general || '';
      noteOmri.value = boardState.notes.omri || '';
      noteGuy.value = boardState.notes.guy || '';

      boardColumns.innerHTML = '';
      boardState.columns.forEach((column, columnIndex) => {
        const wrapper = document.createElement('article');
        wrapper.className = 'column';
        wrapper.innerHTML = `
          <div class="column-head">
            <h2>${escapeHtml(column.title)}</h2>
            <span class="count ${column.color}">${column.items.length}</span>
          </div>
          <div class="items"></div>
          <button class="btn add-card" type="button" data-add="${columnIndex}">+ כרטיס חדש</button>
        `;
        const itemsRoot = wrapper.querySelector('.items');
        column.items.forEach((item, itemIndex) => {
          itemsRoot.appendChild(renderCard(item, columnIndex, itemIndex));
        });
        boardColumns.appendChild(wrapper);
      });
    }

    function renderCard(item, columnIndex, itemIndex) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-tools">
          <strong>כרטיס עבודה</strong>
          <div class="icon-row">
            <button class="icon-btn" type="button" data-move-right="${columnIndex}:${itemIndex}" title="העבר ימינה">→</button>
            <button class="icon-btn" type="button" data-move-left="${columnIndex}:${itemIndex}" title="העבר שמאלה">←</button>
            <button class="icon-btn" type="button" data-move-up="${columnIndex}:${itemIndex}" title="למעלה">↑</button>
            <button class="icon-btn" type="button" data-move-down="${columnIndex}:${itemIndex}" title="למטה">↓</button>
            <button class="icon-btn" type="button" data-delete="${columnIndex}:${itemIndex}" title="מחיקה">×</button>
          </div>
        </div>
        <input class="field" data-bind="title" placeholder="כותרת" value="${escapeAttr(item.title)}">
        <div class="card-grid">
          <input class="field" data-bind="owner" placeholder="אחראי" value="${escapeAttr(item.owner)}">
          <input class="field" data-bind="due" type="date" value="${escapeAttr(item.due)}">
        </div>
        <textarea class="field" data-bind="notes" placeholder="הערות">${escapeHtml(item.notes)}</textarea>
      `;

      card.querySelectorAll('[data-bind]').forEach((field) => {
        field.addEventListener('input', () => {
          boardState.columns[columnIndex].items[itemIndex][field.dataset.bind] = field.value;
          boardState.columns[columnIndex].items[itemIndex].updatedAt = new Date().toISOString();
        });
      });

      return card;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/\n/g, '&#10;');
    }

    function addCard(columnIndex) {
      boardState.columns[columnIndex].items.push({
        id: uid(),
        title: '',
        owner: '',
        due: '',
        notes: '',
        updatedAt: new Date().toISOString()
      });
      renderBoard();
    }

    function moveItem(columnIndex, itemIndex, direction) {
      const columns = boardState.columns;
      const column = columns[columnIndex];
      const item = column.items[itemIndex];
      if (!item) return;

      if (direction === 'left' && columnIndex > 0) {
        column.items.splice(itemIndex, 1);
        columns[columnIndex - 1].items.push(item);
      }
      if (direction === 'right' && columnIndex < columns.length - 1) {
        column.items.splice(itemIndex, 1);
        columns[columnIndex + 1].items.push(item);
      }
      if (direction === 'up' && itemIndex > 0) {
        [column.items[itemIndex - 1], column.items[itemIndex]] = [column.items[itemIndex], column.items[itemIndex - 1]];
      }
      if (direction === 'down' && itemIndex < column.items.length - 1) {
        [column.items[itemIndex + 1], column.items[itemIndex]] = [column.items[itemIndex], column.items[itemIndex + 1]];
      }
      renderBoard();
    }

    function deleteItem(columnIndex, itemIndex) {
      if (!confirm('למחוק את הכרטיס הזה ?')) return;
      boardState.columns[columnIndex].items.splice(itemIndex, 1);
      renderBoard();
    }

    function collectNotes() {
      boardState.notes.general = noteGeneral.value;
      boardState.notes.omri = noteOmri.value;
      boardState.notes.guy = noteGuy.value;
    }

    function resetLocalBoard() {
      if (!confirm('לאפס את הלוח המקומי לפני שמירה ?')) return;
      boardState = structuredClone(defaultBoard);
      boardRow = { updated_at: new Date().toISOString(), updated_by: 'local' };
      renderBoard();
      setStatus('אופס מקומית. צריך לשמור כדי לעדכן את כולם.');
    }

    boardColumns.addEventListener('click', (event) => {
      const target = event.target.closest('button');
      if (!target || !boardState) return;
      if (target.dataset.add) addCard(Number(target.dataset.add));
      ['left', 'right', 'up', 'down'].forEach((direction) => {
        const value = target.dataset[`move${direction[0].toUpperCase()}${direction.slice(1)}`];
        if (!value) return;
        const [columnIndex, itemIndex] = value.split(':').map(Number);
        moveItem(columnIndex, itemIndex, direction);
      });
      if (target.dataset.delete) {
        const [columnIndex, itemIndex] = target.dataset.delete.split(':').map(Number);
        deleteItem(columnIndex, itemIndex);
      }
    });

    reloadBtn.addEventListener('click', () => loadBoard().catch(console.error));
    saveBtn.addEventListener('click', () => saveBoard().catch(console.error));
    resetBtn.addEventListener('click', resetLocalBoard);
    shareBtn.addEventListener('click', () => {
      shareLink.value = currentShareUrl();
      sharePanel.classList.toggle('open');
    });
    copyShareBtn.addEventListener('click', async () => {
      shareLink.value = currentShareUrl();
      await navigator.clipboard.writeText(shareLink.value);
      showToast('קישור הועתק');
    });

    updatedByInput.value = localStorage.getItem(UPDATED_BY_STORAGE) || '';
    boardKey = getInitialKey();
    localStorage.setItem(KEY_STORAGE, boardKey);
    shareLink.value = currentShareUrl();
    loadBoard().catch((error) => {
      console.error(error);
      if (!boardState) {
        boardState = structuredClone(defaultBoard);
        boardRow = null;
        renderBoard();
      }
    });
  </script>
</body>
</html>
